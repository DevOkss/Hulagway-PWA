# Deploys the PWA to GitHub Pages (project site: https://devokss.github.io/Hulagway-PWA/).
#
# Security: no secrets or personal access tokens. The deploy job mints a
# short-lived OIDC token (id-token: write) via the official actions/deploy-pages
# action, with least-privilege job permissions. Dependencies install with
# `npm ci` (locked versions only). VITE_API_URL is intentionally unset so the
# bundle falls back to the production backend (see src/services/api.ts);
# VITE_* values are public by design — never put secrets in them (they ship
# inside the client bundle readable by anyone).
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + SPA + 404 fallback + service worker)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
